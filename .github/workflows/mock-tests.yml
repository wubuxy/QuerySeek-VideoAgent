name: Core mock tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUERYSEEK_LOAD_DOTENV: "0"
      HF_HUB_OFFLINE: "1"
      WANDB_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install core and UI test dependencies
        run: python -m pip install -e ".[dev,agent]" "lm-format-enforcer==0.11.3"
      - name: Run core synthetic tests
        run: >-
          python -m pytest -q
          tests/test_schemas.py tests/test_ingest.py tests/test_models.py
          tests/test_retrieval.py tests/test_fusion.py tests/test_curve_spans.py
          tests/test_export.py tests/test_output_paths.py tests/test_cli.py
          tests/test_agent_budget.py tests/test_search_policy.py
          tests/test_anchored_policy.py tests/test_agent_graph.py
          tests/test_grounded_qa.py tests/test_grounded_qa_baseline.py
          tests/test_grounded_qa_input_study.py
          tests/test_temporal_tree.py tests/test_frame_stdin_isolation.py
          tests/test_query_refinement.py tests/test_query_reader.py tests/test_evidence_packets.py tests/test_evidence_contract.py tests/test_anchor_observations.py tests/test_evidence_needs.py tests/test_model_diagnostic.py tests/test_verifier_diagnostic.py
          tests/test_baseline_integrity.py::test_scene_missing_pts_preserves_log_without_fabricating_time
