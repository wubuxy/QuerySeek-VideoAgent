[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryseek-videoagent"
version = "0.1.0"
description = "QuerySeek-VideoAgent: active visual perception & temporal retrieval agent for long video understanding and smart clipping"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuerySeek Team" }]
keywords = ["video", "vlm", "agent", "temporal-retrieval", "ffmpeg", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# --- P0/P1 core dependencies ------------------------------------------------
# P2 (openclip/torch/faiss) and P3 (langgraph/streamlit) deps are added in
# their own phases; see docs/DECISIONS.md for the incremental dependency policy.
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "srt>=3.5",
    "scenedetect>=0.7",
    "opencv-python-headless>=4.9",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# P2: vision embedding backend (installed in phase 2)
embedding = [
    "open-clip-torch>=2.26",
    "torch>=2.2",
]
# Offline localization studies; not required by the demo.
research = [
    "open-clip-torch>=2.26",
    "torch>=2.2",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]
# P1 optional: local CPU ASR (heavy; skipped automatically when absent)
asr = [
    "faster-whisper>=1.0",
]
# P3: agent orchestration + web UI (installed in phase 3)
agent = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "streamlit>=1.35",
]

[project.scripts]
queryseek = "queryseek.cli:app"

[tool.setuptools.packages.find]
include = ["queryseek*"]

[tool.setuptools.package-data]
"queryseek.vendor.univtg" = ["LICENSE"]
"queryseek.vendor.vts" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["queryseek"]
omit = ["queryseek/cli.py"]
